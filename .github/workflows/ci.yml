name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run db:check-access
      - run: npm run format:check
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
